name: Native client Windows smoke test

# Installs the published Windows installer on a real Windows runner, lets the launcher download the game from the
# published update tree, starts the game headless and uninstalls again.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag with the installer"
        required: false
        default: "native-v1.0.0"
  push:
    branches: ["**"]
    paths: [".github/workflows/native-client-windows-smoke.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || 'native-v1.0.0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Server/go.mod
          cache-dependency-path: Server/go.sum

      - name: Download the installer
        shell: pwsh
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'ErlenwaldOnline-Setup.exe' --dir $env:RUNNER_TEMP
          Get-Item "$env:RUNNER_TEMP\ErlenwaldOnline-Setup.exe" | Select-Object Name, Length

      - name: Install silently
        shell: pwsh
        run: |
          $p = Start-Process "$env:RUNNER_TEMP\ErlenwaldOnline-Setup.exe" -ArgumentList '/S', '/D=C:\ErlenwaldTest' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          foreach ($f in 'Launcher.exe', 'Launcher.pck', 'launcher_defaults.json', 'Uninstall.exe') {
            if (-not (Test-Path "C:\ErlenwaldTest\$f")) { throw "missing $f" }
          }
          Get-ChildItem C:\ErlenwaldTest | Select-Object Name, Length
          $desk = [Environment]::GetFolderPath('Desktop')
          "desktop folder: $desk"
          if (-not (Test-Path "$desk\Erlenwald Online.lnk")) { throw "desktop shortcut missing in $desk" }
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$desk\Erlenwald Online.lnk")
          "shortcut target: $($lnk.TargetPath)"
          if ($lnk.TargetPath -ne 'C:\ErlenwaldTest\Launcher.exe') { throw "wrong shortcut target" }
          $sm = [Environment]::GetFolderPath('Programs')
          if (-not (Test-Path "$sm\Erlenwald Online\Erlenwald Online.lnk")) { throw "start menu shortcut missing" }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ErlenwaldOnline' -ErrorAction SilentlyContinue)) { throw "uninstall registry entry missing" }

      - name: Fetch the update tree
        shell: pwsh
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" "$env:RUNNER_TEMP\pages"
          Get-ChildItem "$env:RUNNER_TEMP\pages\updates" | Select-Object Name
          Start-Process python -ArgumentList '-m', 'http.server', '8099', '--bind', '127.0.0.1', '--directory', "$env:RUNNER_TEMP\pages\updates" -WindowStyle Hidden
          Start-Sleep 3

      - name: Launcher installs the game (command line mode, headless)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\launcher.log"
          $p = Start-Process 'C:\ErlenwaldTest\Launcher.exe' -ArgumentList '--headless', '--log-file', $out, '--', '--cli-update', '--url', 'http://127.0.0.1:8099', '--root', 'C:\ErlenwaldTest' -Wait -PassThru
          Get-Content $out
          "launcher exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path $out -Pattern 'RESULT: ok' -Quiet)) { throw "launcher did not report success" }
          foreach ($f in 'game\ErlenwaldOnline.exe', 'game\ErlenwaldOnline.pck', 'game\installed.json') {
            if (-not (Test-Path "C:\ErlenwaldTest\$f")) { throw "missing $f" }
          }
          Get-ChildItem C:\ErlenwaldTest\game | Select-Object Name, Length

      - name: Game starts (headless, quits by itself)
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\game.log"
          $p = Start-Process 'C:\ErlenwaldTest\game\ErlenwaldOnline.exe' -ArgumentList '--headless', '--log-file', $log, '--quit-after', '120' -Wait -PassThru
          Get-Content $log
          "game exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          if (Select-String -Path $log -Pattern 'SCRIPT ERROR|Parse Error|Failed to load' -Quiet) { throw "script errors in the game log" }

      - name: Game opens a window with software rendering (D3D12 WARP) and draws the login screen
        shell: pwsh
        continue-on-error: true
        run: |
          $shot = "$env:RUNNER_TEMP\login.png"
          $log = "$env:RUNNER_TEMP\game-gui.log"
          $p = Start-Process 'C:\ErlenwaldTest\game\ErlenwaldOnline.exe' -ArgumentList '--rendering-driver', 'd3d12', '--resolution', '1280x720', '--log-file', $log, '--', '--shot', $shot, '6' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Get-Content $log; throw "game did not finish" }
          Get-Content $log
          "game exit code: $($p.ExitCode)"
          if (-not (Test-Path $shot)) { throw "no screenshot written" }
          Copy-Item $shot "$env:GITHUB_WORKSPACE\login.png"

      - name: Upload the screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-login-screenshot
          path: login.png
          if-no-files-found: warn

      - name: Play on Windows against a real server (walk, fight, trade, quests, trainer, griffin flight, gamepad)
        shell: pwsh
        run: |
          Push-Location Server
          go build -o "$env:RUNNER_TEMP\server.exe" ./cmd/server
          Pop-Location
          $srv = Start-Process "$env:RUNNER_TEMP\server.exe" -ArgumentList '-client', '""', '-data', "$env:RUNNER_TEMP\data", '-addr', ':8084', '-dev' -PassThru -WindowStyle Hidden -RedirectStandardError "$env:RUNNER_TEMP\server.log"
          Start-Sleep 4
          $failed = $false
          foreach ($t in @(@('play', 'winplay1'), @('play2', 'winplay2'), @('pad', 'winplay3'))) {
            $log = "$env:RUNNER_TEMP\game-$($t[0]).log"
            $p = Start-Process 'C:\ErlenwaldTest\game\ErlenwaldOnline.exe' -ArgumentList '--headless', '--log-file', $log, '--', '--autologin', 'localhost:8084', $t[1], 'secret2', '--autoenter', "--$($t[0])" -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "TIMEOUT in $($t[0])" ; $failed = $true }
            Select-String -Path $log -Pattern 'PASS|FAIL|RESULT|SCRIPT ERROR' | ForEach-Object { $_.Line }
            if (-not (Select-String -Path $log -Pattern '(PLAY|PLAY2|PAD) RESULT: OK' -Quiet)) { Write-Host "no OK result for $($t[0])"; $failed = $true }
          }
          Stop-Process -Id $srv.Id -Force
          if ($failed) { throw "gameplay checks failed" }

      - name: Publish the screenshot (branch ci-screenshots, so it can be looked at)
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Test-Path login.png)) { throw "no screenshot" }
          $d = "$env:RUNNER_TEMP\shots"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item login.png "$d\windows-login.png"
          Push-Location $d
          git init -q -b ci-screenshots
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -q -m "Windows login screenshot"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" ci-screenshots

      - name: Launcher update check is quiet when everything is current
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\launcher2.log"
          $p = Start-Process 'C:\ErlenwaldTest\Launcher.exe' -ArgumentList '--headless', '--log-file', $out, '--', '--cli-update', '--url', 'http://127.0.0.1:8099', '--root', 'C:\ErlenwaldTest' -Wait -PassThru
          Get-Content $out
          if (Select-String -Path $out -Pattern 'Lade ' -Quiet) { throw "second run downloaded again" }

      - name: Uninstall
        shell: pwsh
        run: |
          $p = Start-Process 'C:\ErlenwaldTest\Uninstall.exe' -ArgumentList '/S', '_?=C:\ErlenwaldTest' -Wait -PassThru
          "uninstaller exit code: $($p.ExitCode)"
          if (Test-Path 'C:\ErlenwaldTest\Launcher.exe') { throw "launcher still installed" }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ErlenwaldOnline') { throw "registry entry still there" }
